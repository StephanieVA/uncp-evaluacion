{% extends "base.html" %}
{% block title %}{{ 'Editar' if jurado else 'Nuevo' }} Jurado{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ 'Editar' if jurado else 'Nuevo' }} Jurado</h2>
  <form method="POST">
    <div class="form-group"><label>Nombre *</label>
      <input name="nombre" value="{{ jurado.nombre if jurado else '' }}" required></div>
    <div class="form-group"><label>DNI</label>
      <input name="dni" value="{{ jurado.dni if jurado else '' }}"></div>
    <div class="form-group"><label>Día asignado *</label>
      <select name="dia_asignado" required>
        <option value="1" {{ 'selected' if jurado and jurado.dia_asignado==1 }}>Día 1</option>
        <option value="2" {{ 'selected' if jurado and jurado.dia_asignado==2 }}>Día 2</option>
      </select></div>
    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('lista_jurados') }}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
